services:
  nginx:
    image: nginx:stable-alpine
    container_name: of_nginx
    ports: 
      - "8080:80"
    volumes:
      - ./public:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
        - of_network
    restart: unless-stopped

networks:
  of_network:
    driver: bridge
  
